map $arg_v $aac_static_cache_control {
    default "public, max-age=86400";
    "~^[a-f0-9]{12}$" "public, max-age=31536000, immutable";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $aac_api http://aac-api:8000;
    client_max_body_size 11m;
    include /etc/nginx/aac-security-headers.conf;
    location = /health { include /etc/nginx/aac-security-headers.conf; access_log off; root /tmp; default_type text/plain; try_files /aac-assets-ready =503; }
    location = /version.json { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control no-store; try_files $uri =404; }
    location = /robots.txt { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control "public, max-age=3600"; default_type text/plain; try_files $uri =404; }
    location /api/ {
        proxy_pass $aac_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /media/ {
        proxy_pass $aac_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
    }
    # Only hashed build assets are shared. HTML/version.json stay per-release.
    location ^~ /assets/. { return 404; }
    location /assets/ {
        root /var/lib/aac;
        include /etc/nginx/aac-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /fonts/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control $aac_static_cache_control; try_files $uri =404; }
    location /images/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control $aac_static_cache_control; try_files $uri =404; }
    location /logos/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control $aac_static_cache_control; try_files $uri =404; }
    # Add public metadata to the initial HTML for browsers and crawlers.
    location = /_page-metadata {
        internal;
        proxy_pass $aac_api/api/page-metadata;
        proxy_set_header X-AAC-Page-URI $request_uri;
        proxy_set_header Cookie "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
    location / {
        include /etc/nginx/aac-security-headers.conf;
        add_header Cache-Control no-cache;
        ssi on;
        try_files $uri $uri/ /index.html;
    }
}
