server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $aac_api http://aac-api:8000;
    client_max_body_size 11m;
    include /etc/nginx/aac-security-headers.conf;
    location = /health { include /etc/nginx/aac-security-headers.conf; access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /version.json { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control no-store; try_files $uri =404; }
    location /api/ {
        proxy_pass $aac_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /media/ {
        proxy_pass $aac_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
    }
    location /assets/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /fonts/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /images/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location /logos/ { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location / { include /etc/nginx/aac-security-headers.conf; add_header Cache-Control no-cache; try_files $uri $uri/ /index.html; }
}
