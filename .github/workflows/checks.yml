name: Website checks
on:
  push:
    branches: [aac-rebuild]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    branches: [aac-rebuild, main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aac
          POSTGRES_PASSWORD: aac
          POSTGRES_DB: aac
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aac" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aac:aac@127.0.0.1:55432/aac
      SESSION_SECRET: aac-isolated-ci-only-session-secret-123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check --config backend/pyproject.toml backend deploy scripts
      - run: alembic upgrade head && alembic check && pytest -q
        working-directory: backend
      - name: Check generated OpenAPI
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from app.main import app
          Path('openapi.json').write_text(json.dumps(app.openapi(), indent=2) + '\n')
          PY
          git diff --exit-code -- openapi.json
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run api:types && npm run build && npm test
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/lib/api-schema.d.ts
      - name: Rolling frontend releases share immutable assets
        run: |
          docker build -f deploy/frontend.Dockerfile -t aac-web:rolling-assets .
          AAC_ASSET_TEST_IMAGE=aac-web:rolling-assets python3 -m unittest discover -s deploy/tests -v
  browser:
    name: browser (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Each runner owns its database, API, media, and artifacts. Keep one worker
    # inside each suite because mutating tests reset the entire fixture database.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: layouts
            config: playwright.config.ts
            browsers: chromium
          - suite: journeys-chromium
            config: playwright.journeys.config.ts
            project: chromium-*
            browsers: chromium
          - suite: journeys-firefox
            config: playwright.journeys.config.ts
            project: firefox-*
            browsers: firefox
          - suite: journeys-webkit
            config: playwright.journeys.config.ts
            project: webkit-*
            browsers: webkit
          - suite: retreat
            config: playwright.retreat.config.ts
            browsers: chromium
          - suite: search
            config: playwright.search.config.ts
            browsers: chromium webkit
          - suite: bans
            config: playwright.bans.config.ts
            browsers: chromium webkit
          - suite: approvals
            config: playwright.approvals.config.ts
            browsers: chromium webkit
          - suite: forms
            config: playwright.forms.config.ts
            browsers: chromium webkit
          - suite: boundaries
            config: playwright.boundaries.config.ts
            browsers: chromium
          - suite: keyboard
            config: playwright.keyboard.config.ts
            browsers: chromium webkit
          - suite: production
            config: playwright.social.config.ts
            browsers: chromium firefox webkit
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aac
          POSTGRES_PASSWORD: aac
          POSTGRES_DB: aac_browser
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aac" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aac:aac@127.0.0.1:55432/aac_browser
      APP_URL: http://localhost:5173
      SESSION_SECRET: aac-isolated-browser-only-session-secret-123456789
      INITIAL_OFFICER_EMAILS: officer@uci.edu
      MEDIA_ROOT: /tmp/aac-browser-media
      DUES_VENMO_HANDLE: "@fixture-club"
      DUES_ZELLE_CONTACT: fixture@uci.edu
      DUES_ZELLE_NAME: Fixture Recipient
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic upgrade head
        working-directory: backend
      - run: python scripts/seed-browser-fixtures.py
      - run: npm ci
        working-directory: frontend
      - name: Install suite browsers
        working-directory: frontend
        env:
          PLAYWRIGHT_BROWSERS: ${{ matrix.browsers }}
        run: |
          read -r -a browser_engines <<< "$PLAYWRIGHT_BROWSERS"
          npx playwright install --with-deps "${browser_engines[@]}"
      - name: Start isolated application
        run: |
          mkdir -p artifacts
          (cd backend && uvicorn app.main:app --host 127.0.0.1 --port 8000) > artifacts/api.log 2>&1 &
          (cd frontend && npm run dev -- --host localhost --port 5173) > artifacts/web.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for url in ['http://127.0.0.1:8000/api/health/ready', 'http://localhost:5173']:
              for attempt in range(60):
                  try:
                      urllib.request.urlopen(url, timeout=2)
                      break
                  except Exception:
                      time.sleep(1)
              else:
                  raise SystemExit(f'Application did not become ready: {url}')
          PY
      - name: Run browser suite
        if: matrix.suite != 'production'
        working-directory: frontend
        env:
          PLAYWRIGHT_CONFIG: ${{ matrix.config }}
          PLAYWRIGHT_PROJECT: ${{ matrix.project || '*' }}
        run: npx playwright test --config "$PLAYWRIGHT_CONFIG" --project "$PLAYWRIGHT_PROJECT" --workers=1
      - name: Production HTML embeds and responsive branding
        if: matrix.suite == 'production'
        working-directory: frontend
        run: |
          npm run build
          python - <<'PY'
          from pathlib import Path
          config = Path('../deploy/nginx.conf').read_text()
          Path('../artifacts/social-nginx.conf').write_text(config.replace('http://aac-api:8000', 'http://127.0.0.1:8000'))
          PY
          docker run -d --name aac-social-nginx --network host \
            -v "$PWD/dist:/usr/share/nginx/html:ro" \
            -v "$PWD/dist/assets:/var/lib/aac/assets:ro" \
            -v "$PWD/../artifacts/social-nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/../deploy/security-headers.conf:/etc/nginx/aac-security-headers.conf:ro" \
            nginxinc/nginx-unprivileged:1.28.0-alpine@sha256:a6bd0e0995ab4723fb65068665f8016decb67dc6a6a32eddc415c7d1229cada6
          E2E_URL=http://localhost:8080 E2E_SERVES_METADATA=1 npm run test:e2e:social
          E2E_BASE_URL=http://localhost:8080 npm run test:e2e:speed
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: browser-${{ matrix.suite }}-failure-evidence
          path: |
            artifacts/restrictions-and-bans
            artifacts/external-member-approval
            artifacts/event-forms
            artifacts/viewports
            artifacts/journeys
            artifacts/test-results
            artifacts/playwright-results.json
            artifacts/journey-results.json
            artifacts/journey-traces
            artifacts/retreat-benchmark/browser-results.json
            artifacts/retreat-benchmark/traces
            artifacts/retreat-benchmark/screens
            artifacts/boundary-results.json
            artifacts/boundary-traces
            artifacts/keyboard-results.json
            artifacts/keyboard-traces
            artifacts/search-results.json
            artifacts/search-traces
            artifacts/search-review
            artifacts/social-results.json
            artifacts/social-traces
            artifacts/page-speed
            artifacts/api.log
            artifacts/web.log
          retention-days: 7
  # Retain the existing required check name for branch protection.
  views:
    if: always()
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every browser suite to pass
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$BROWSER_RESULT" != "success" ]]; then
            echo "Browser suites ended with: $BROWSER_RESULT"
            exit 1
          fi
